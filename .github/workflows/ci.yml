# ──────────────────────────────────────────────────────────────
# Gatekeeper — CI/CD Pipeline
# Lint → Test → Build → Push to GHCR on tag
# ──────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/gatekeeper

jobs:
  # ── Lint ────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gatekeeper-proxy, gatekeeper-backend, gatekeeper-control-plane]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff>=0.8.0

      - name: Lint ${{ matrix.service }}
        run: ruff check ${{ matrix.service }}/

      - name: Format check ${{ matrix.service }}
        run: ruff format --check ${{ matrix.service }}/

  # ── Test ────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gatekeeper-proxy, gatekeeper-backend, gatekeeper-control-plane]
    services:
      # Only the control-plane tests touch Postgres; service is cheap to spin up
      # unconditionally rather than splitting the matrix.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gatekeeper
          POSTGRES_PASSWORD: gatekeeper_dev
          POSTGRES_DB: gatekeeper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gatekeeper"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      GK_CP_DATABASE_URL: postgresql+asyncpg://gatekeeper:gatekeeper_dev@localhost:5432/gatekeeper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd ${{ matrix.service }}
          pip install -e ".[dev]"

      - name: Apply control-plane migrations
        if: matrix.service == 'gatekeeper-control-plane'
        run: |
          cd ${{ matrix.service }}
          alembic upgrade head

      - name: Run tests
        run: |
          cd ${{ matrix.service }}
          python -m pytest tests/ -v --tb=short

  # ── OPA Rego policy tests ───────────────────────────────────
  test-policies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OPA
        run: |
          curl -L -o /usr/local/bin/opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x /usr/local/bin/opa
          opa version

      - name: Run Rego unit tests
        run: opa test policies -v

  # ── Dashboard unit tests ────────────────────────────────────
  test-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: gatekeeper-dashboard/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          cd gatekeeper-dashboard
          pnpm install --frozen-lockfile

      - name: Run tests
        run: |
          cd gatekeeper-dashboard
          pnpm test

  # ── E2E Smoke Tests ─────────────────────────────────────────
  e2e:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Build dashboard
        run: |
          cd gatekeeper-dashboard
          npm ci
          npm run build

      - name: Start stack
        run: docker compose -f infra/docker-compose.yml up -d --wait
        timeout-minutes: 5

      - name: Wait for proxy health
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/proxy/health && break
            echo "Waiting for proxy... ($i/30)"
            sleep 3
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps
        run: pip install pytest httpx

      - name: Run E2E tests
        run: pytest tests/test_e2e.py -v --tb=short

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --tail=100

      - name: Tear down
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v

  # ── Build & Push Docker Images ─────────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: [lint, test, test-dashboard, test-policies, e2e]
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - service: gatekeeper-proxy
            context: ./gatekeeper-proxy
          - service: gatekeeper-backend
            context: ./gatekeeper-backend
          - service: gatekeeper-control-plane
            context: ./gatekeeper-control-plane
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Security Scan ──────────────────────────────────────────
  security:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        service: [gatekeeper-proxy, gatekeeper-backend, gatekeeper-control-plane]
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH
